[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "edge-comparator-backend"
version = "0.1.0"
description = "Edge-AI Hardware Comparator Backend Preflight Prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "onnx==1.23.0",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "types-protobuf==7.35.1.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edge_comparator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RET",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--cov=edge_comparator",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
