name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.repository == 'L-series/edge-comparator' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'edge-comparator-local' }}
    timeout-minutes: 20
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node on the hosted PR runner
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked repository tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository quality
        run: npm run check
      - name: Lint workflow and Docker recipes
        env:
          HADOLINT_IMAGE: hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            hadolint ci/Dockerfile ci/runner.Dockerfile
            actionlint
          else
            docker run --rm --network none -v "$PWD:/work:ro" -w /work "$HADOLINT_IMAGE" hadolint ci/Dockerfile ci/runner.Dockerfile
            docker run --rm --network none -v "$PWD:/work:ro" -w /work "$ACTIONLINT_IMAGE"
          fi
      - name: Preserve public-only test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
