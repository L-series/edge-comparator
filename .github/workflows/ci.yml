name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.repository == 'L-series/edge-comparator' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)) }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'edge-comparator-local' }}
    timeout-minutes: 20
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node on the hosted PR runner
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked repository tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository quality
        run: npm run check
      - name: Install uv on the hosted PR runner
        if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          enable-cache: false
      - name: Backend quality and package build
        working-directory: backend
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src tests
          uv run --frozen pytest
          uv build --no-sources
      - name: Mandatory real pinned OpenVINO compiler cases
        working-directory: backend
        run: uv run --frozen pytest -m integration --no-cov --junitxml=reports/compiler-integration.xml
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - name: Frontend quality and production build
        run: npm --prefix frontend run check
      - name: Install Chromium on the hosted PR runner
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Real browser/API flow and accessibility
        run: npm --prefix frontend run test:e2e
      - name: Lint workflow and Docker recipes
        env:
          HADOLINT_IMAGE: hadolint/hadolint:v2.14.0-debian@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            hadolint ci/Dockerfile ci/runner.Dockerfile
            actionlint
          else
            docker run --rm --network none -v "$PWD:/work:ro" -w /work "$HADOLINT_IMAGE" hadolint ci/Dockerfile ci/runner.Dockerfile
            docker run --rm --network none -v "$PWD:/work:ro" -w /work "$ACTIONLINT_IMAGE"
          fi
      - name: Verify portable Docker environments on the hosted PR runner
        if: github.event_name == 'pull_request'
        run: |
          docker build --quiet -f ci/Dockerfile -t edge-quality:pr .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges edge-quality:pr
          docker build --quiet -f ci/runner.Dockerfile -t edge-runner:pr .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges edge-runner:pr bash -c './bin/Runner.Listener --version && node --version && uv --version'
      - name: Preserve public-only test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            reports/
            backend/reports/
            frontend/reports/
            frontend/test-results/
          if-no-files-found: error
          retention-days: 14
